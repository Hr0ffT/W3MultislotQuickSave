; W3MultislotQuickSave - rotating quick saves and a quick load key for Warcraft III 1.26a and 1.27b
[W3MultislotQuickSave]

; Number of quick save files: QuickSave_1 .. QuickSave_N, written in turn (default 10)
Slots=10

; Quick save key (default F6, the game's own). Another key works as F6 does; F6 keeps working too.
; Keys: F1..F12, a letter or a digit, or a virtual-key code like 0x75
QuickSaveKey=F6

; Quick load key: loads the newest quick save (default F8). The key does nothing else in the game then.
QuickLoadKey=F8

; 1 = write W3MultislotQuickSave.log next to the game (for bug reports)
Debug=0
